name: Minekube Launcher (build)

# Builds UNSIGNED installers of the Minekube Launcher for every platform:
#   - Windows: NSIS installer (.exe)
#   - macOS:   disk image (.dmg), universal (Apple Silicon + Intel), ad-hoc signed
#   - Linux:   Debian/Ubuntu package (.deb) and portable AppImage
# Runs only on standard GitHub-hosted runners — no certificates or secrets.
#
# Trigger it manually from the "Actions" tab (Run workflow), on a tag push
# like `v1.0.0`, or open a pull request touching the launcher code. Each
# installer is uploaded as a build artifact on the run's summary page; a tag
# push also publishes all of them in one GitHub release.

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/minekube-build.yml
      - 'apps/app/**'
      - 'apps/app-frontend/**'
      - 'packages/**'
      - Cargo.toml
      - Cargo.lock
      - pnpm-lock.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            build-args: --bundles nsis
            artifact: Minekube-Launcher-windows
            files: |
              target/release/bundle/nsis/*-setup.exe
          - name: macOS
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin --bundles dmg
            artifact: Minekube-Launcher-macos
            files: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            # The oldest supported Ubuntu keeps the .deb and AppImage
            # compatible with as many distributions as possible.
            runner: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            build-args: --bundles deb,appimage
            artifact: Minekube-Launcher-linux
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain (1.95.0)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libgtk-3-dev patchelf file xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Java 17 (needed to build the bundled Java helpers)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # A tag like `v1.2.1` decides the version: the installers are named after
      # it and the Launcher reports it, so the built-in update check never
      # offers the release a player already has.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like v1.2.3"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const pkgFile = "apps/app-frontend/package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgFile, "utf8"));
            pkg.version = version;
            fs.writeFileSync(pkgFile, JSON.stringify(pkg, null, "\t") + "\n");
            for (const file of ["apps/app/Cargo.toml", "packages/app-lib/Cargo.toml"]) {
              const toml = fs.readFileSync(file, "utf8");
              fs.writeFileSync(file, toml.replace(/^version = ".*"$/m, `version = "${version}"`));
            }
          ' "$VERSION"
          echo "Building Minekube Launcher $VERSION"

      - name: Provide backend environment (.env)
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Install dependencies
        run: pnpm install

      - name: Build Minekube Launcher
        run: pnpm --filter=@modrinth/app run tauri build ${{ matrix.build-args }}
        env:
          # Lets the .dmg get its styled window (background, icon positions)
          # even though it is built on a CI machine.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.files }}

  # Publishes every installer in one GitHub release so the Launcher's built-in
  # "Aktualizace" (update) button finds the latest release on GitHub and the
  # updater endpoint (releases/latest/download/latest.json) has a release to
  # point to.
  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # "Minekube Launcher_1.2.0_amd64.AppImage" → "Minekube_Launcher_1.2.0_amd64.AppImage":
          # Linux link registration breaks on an AppImage path with spaces.
          for f in dist/*; do
            [ "$f" = "${f// /_}" ] || mv "$f" "${f// /_}"
          done
          ls -la dist
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Minekube Launcher ${VERSION}" \
            --notes "Minekube Launcher ${VERSION}" \
            dist/*
